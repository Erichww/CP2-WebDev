<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Multiverso Store | Colecionáveis &amp; Action Figures</title>
  <link rel="stylesheet" href="src/css/estilo.css" />
</head>
<body>

  <!-- HEADER -->
  <header>
    <nav>
      <a href="index.html" class="logo">Multiverso <span>Store</span></a>
      <ul class="nav-links">
        <li><a href="index.html">Produtos</a></li>
        <li><a href="pages/sobre.html">Sobre</a></li>
        <li><a href="pages/loja.html">Carrinho</a></li>
      </ul>
    </nav>
  </header>

  <!-- HERO -->
  <section class="hero">
    <div class="hero-content">
      <div class="hero-badge">★ COLECIONÁVEIS PREMIUM</div>
      <h1>ACTION<br><span class="highlight">FIGURES</span></h1>
      <p class="hero-sub">Heróis e Personagens de Anime.</p>
      <div class="hero-cta">
        <a href="#catalogo" class="btn-primary">Ver Catálogo</a>
      </div>
    </div>
  </section>

  <!-- PRODUTOS -->
  <main id="catalogo">
    <div class="section">
      <div class="section-header fade-in">
        <span class="section-label">Catálogo 2026</span>
        <h2 class="section-title">NOSSOS <span>PRODUTOS</span></h2>
        <div class="divider"></div>
      </div>

      <!-- Cards gerados via JavaScript (DOM) -->
      <div class="products-grid" id="produtosGrid"></div>
    </div>
  </main>

  <!-- FOOTER -->
  <footer>
    <div class="footer-logo">Multiverso <span>Store</span></div>
    <p>&copy; 2026 &mdash; Todos os direitos reservados</p>
  </footer>

  <script src="src/js/script.js"></script>
</body>
</html>
